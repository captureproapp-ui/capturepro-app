<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow-small" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="0.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="32" height="32" fill="#0F172A" rx="4"/>

  <!-- Simplified falcon for small size -->
  <g filter="url(#glow-small)" transform="translate(11, 10)">
    <!-- Wing -->
    <path d="M -4 -2 L -7 2 L -4 1 Z" fill="#FFFFFF"/>

    <!-- Body -->
    <ellipse cx="0" cy="0" rx="2.5" ry="3.5" fill="#FFFFFF"/>

    <!-- Head -->
    <circle cx="1" cy="-2.5" r="1.8" fill="#FFFFFF"/>

    <!-- Beak -->
    <path d="M 2.5 -2.5 L 3.5 -2.3 L 2.7 -2 Z" fill="#FFFFFF"/>

    <!-- Tail -->
    <path d="M -2 2 L -3 4 L -1.5 2.5 Z" fill="#FFFFFF"/>
  </g>

  <!-- Letter C - simplified and bold for readability -->
  <text x="16" y="26" font-family="Arial, sans-serif" font-size="11" font-weight="900" fill="#4A9EFF" stroke="#3B82F6" stroke-width="0.5">C</text>

  <!-- Letter P - simplified and bold for readability -->
  <text x="23" y="26" font-family="Arial, sans-serif" font-size="11" font-weight="900" fill="#A3E635" stroke="#84CC16" stroke-width="0.5">P</text>
</svg>
