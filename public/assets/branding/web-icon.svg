<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Glow filter for falcon -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle shadow for depth -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="#0F172A" rx="64"/>

  <!-- Falcon silhouette - Dynamic side profile with spread wings -->
  <g filter="url(#glow)" transform="translate(256, 256)">
    <!-- Upper wing spread -->
    <path d="M -80 -40 Q -120 -80, -140 -100 Q -150 -110, -155 -105 Q -145 -95, -130 -85 Q -100 -65, -70 -45 Z"
          fill="#FFFFFF" opacity="0.95"/>

    <!-- Main wing -->
    <path d="M -70 -45 L -120 0 Q -130 10, -125 15 Q -115 10, -100 5 L -60 -20 Z"
          fill="#FFFFFF"/>

    <!-- Body and head -->
    <ellipse cx="0" cy="0" rx="35" ry="45" fill="#FFFFFF"/>

    <!-- Head detail -->
    <ellipse cx="15" cy="-35" rx="22" ry="25" fill="#FFFFFF"/>

    <!-- Beak -->
    <path d="M 30 -35 L 50 -32 L 35 -28 Z" fill="#FFFFFF" opacity="0.9"/>

    <!-- Eye detail (small dark spot for definition) -->
    <circle cx="25" cy="-38" r="3" fill="#0F172A" opacity="0.6"/>

    <!-- Lower wing -->
    <path d="M -60 20 L -110 50 Q -125 60, -120 68 Q -108 62, -95 55 L -50 30 Z"
          fill="#FFFFFF" opacity="0.9"/>

    <!-- Tail feathers -->
    <path d="M -30 40 L -45 75 Q -50 85, -45 88 Q -40 83, -35 75 L -25 45 Z"
          fill="#FFFFFF" opacity="0.85"/>
    <path d="M -20 42 L -30 80 Q -33 90, -28 92 Q -24 87, -20 78 L -15 47 Z"
          fill="#FFFFFF" opacity="0.85"/>

    <!-- Chest/belly detail -->
    <ellipse cx="5" cy="15" rx="20" ry="25" fill="#FFFFFF" opacity="0.3"/>
  </g>

  <!-- Letter C with shadow -->
  <g filter="url(#shadow)">
    <path d="M 140 380 Q 120 360, 120 330 Q 120 300, 140 280 Q 160 260, 190 260 Q 210 260, 225 270 L 215 295 Q 205 287, 190 287 Q 172 287, 160 300 Q 148 313, 148 330 Q 148 347, 160 360 Q 172 373, 190 373 Q 205 373, 215 365 L 225 390 Q 210 400, 190 400 Q 160 400, 140 380 Z"
          fill="#4A9EFF"
          stroke="#3B82F6"
          stroke-width="2"/>
  </g>

  <!-- Letter P with shadow -->
  <g filter="url(#shadow)">
    <path d="M 260 395 L 260 265 L 320 265 Q 345 265, 360 280 Q 375 295, 375 320 Q 375 345, 360 360 Q 345 375, 320 375 L 288 375 L 288 395 Z M 288 290 L 288 350 L 318 350 Q 330 350, 338 342 Q 346 334, 346 320 Q 346 306, 338 298 Q 330 290, 318 290 Z"
          fill="#A3E635"
          stroke="#84CC16"
          stroke-width="2"/>
  </g>

  <!-- Subtle accent lines for dynamism -->
  <g opacity="0.15">
    <line x1="100" y1="150" x2="80" y2="130" stroke="#4A9EFF" stroke-width="2" stroke-linecap="round"/>
    <line x1="110" y1="160" x2="85" y2="140" stroke="#4A9EFF" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="120" y1="170" x2="90" y2="150" stroke="#A3E635" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>
